services:
  aitutor:
    build: .
    container_name: socratic_ai_tutor
    ports:
      - "8501:8501"
    volumes:
      - aitutor_chroma_data:/app/chroma_db
      - aitutor_uploads:/app/temp_uploads
    env_file:
      - .env
    restart: unless-stopped

volumes:
  aitutor_chroma_data:
  aitutor_uploads:
